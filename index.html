<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>PokeDex</title>
  <link rel="shortcut icon" href="./Imagem/pokedex.png" type="image/x-icon">
  <link rel="stylesheet" href="./style.css" />
  <link href="https://fonts.googleapis.com/css?family=Rubik&display=swap" rel="stylesheet" />
  <link href="https://fonts.cdnfonts.com/css/pokemon-solid" rel="stylesheet">
</head>
<body>

  <div class="container">

    <h1 class="Tittle">POKEMON</h1>
    <ul data-js="pokedex" class="pokedex"></ul>

  <div class="CountError">
    <label for="">ACERTOS - </label><label for="" id="acertos" class="Correct"> 0</label>
    <label for="">ERROS - </label><label for="" id="errou" class="error"> 0</label>
    <label for="">PULOU - </label><label for="" id="pulou" class="skipped"> 0</label>
  </div>



<div id="IdStart" class="ShowElements">
    <div class="ImgEID">
      <div class="numbimg">


        <div class="bordaImg">
          <div class="imgpokemon">
            <img src="" alt="" id="pic1" class="Image">
          </div>
        </div>



          <button id="numerobt">
            <span id="numero"></span>
          </button>        
      </div>
    </div>
    


<div class="guessDiv">

      <div class="lab">
         <label for="" class="ThePokeName">QUAL O NOME DESTE POKEMON?</label>      
      </div>  




          <div class="inputVDandSk">
            <button class="Btn" onclick="skip()">
              Pular
              <svg viewBox="0 0 320 512" class="svg">
                <path
                  d="M52.5 440.6c-9.5 7.9-22.8 9.7-34.1 4.4S0 428.4 0 416V96C0 83.6 7.2 72.3 18.4 67s24.5-3.6 34.1 4.4l192 160L256 241V96c0-17.7 14.3-32 32-32s32 14.3 32 32V416c0 17.7-14.3 32-32 32s-32-14.3-32-32V271l-11.5 9.6-192 160z"
                ></path>
              </svg>
            </button>          

            <div class="input-group">
              <input required="" type="text" name="text" autocomplete="off" class="input" id="input" placeholder="Escreva aqui">
            </div>



            <button class="buttonVD" onclick="validation()">
              Verificar
            </button>
          </div>
        </div>


      </div>
      



<div id="iniciar" class="iniciar">
  <button class="button" onclick="load()" id="botaoS">
    <svg class="svgIcon" viewBox="0 0 512 512" height="1em" xmlns="http://www.w3.org/2000/svg"><path d="M256 512A256 256 0 1 0 256 0a256 256 0 1 0 0 512zm50.7-186.9L162.4 380.6c-19.4 7.5-38.5-11.6-31-31l55.5-144.3c3.3-8.5 9.9-15.1 18.4-18.4l144.3-55.5c19.4-7.5 38.5 11.6 31 31L325.1 306.7c-3.2 8.5-9.9 15.1-18.4 18.4zM288 256a32 32 0 1 0 -64 0 32 32 0 1 0 64 0z"></path></svg>
   Começar
 </button>
  <label for="" class="NameOfPokemon" id="TheNameOfPokemon"></label>
</div>


  <div class="geracaopoke" id="masterGene">
    <button class="gen" id="gene1" onclick="generation1()">GERAÇÃO  01  </button>
    <button class="gen" id="gene2" onclick="generation2()">GERAÇÃO  02 </button>
    <button class="gen" id="gene3" onclick="generation3()">GERAÇÃO  03  </button>
    <button class="gen" id="gene4" onclick="generation4()">GERAÇÃO  04  </button>
    <button class="gen" id="gene5" onclick="generation5()">GERAÇÃO  05  </button>
    <button class="gen" id="gene6" onclick="generation6()">GERAÇÃO  06  </button>
    <button class="gen" id="gene7" onclick="generation7()">GERAÇÃO  07  </button>  
    <button class="gen" id="gene8" onclick="generation8()">GERAÇÃO  08  </button>
    <button class="gen" id="gene9" onclick="generation9()">GERAÇÃO  09  </button>    
  </div>
  

 



<div class="contentBT-rr">
  <button type="button" class="buttonRR" id="restart" onclick="window.location.reload();">
    <span class="buttonRR__text">Refresh</span>
    <span class="buttonRR__icon"><svg class="svgRR" height="48" viewBox="0 0 48 48" width="48" xmlns="http://www.w3.org/2000/svg"><path d="M35.3 12.7c-2.89-2.9-6.88-4.7-11.3-4.7-8.84 0-15.98 7.16-15.98 16s7.14 16 15.98 16c7.45 0 13.69-5.1 15.46-12h-4.16c-1.65 4.66-6.07 8-11.3 8-6.63 0-12-5.37-12-12s5.37-12 12-12c3.31 0 6.28 1.38 8.45 3.55l-6.45 6.45h14v-14l-4.7 4.7z"></path><path d="M0 0h48v48h-48z" fill="none"></path></svg></span>
  </button>
</div>




    
  
    
   </div>
   </div>








   <div class="custom-frame">
    <div class="screen">
      <!-- Conteúdo da tela vai aqui -->
    </div>
  </div>






  <script src="./app.js" defer></script>  
</body>
</html>
